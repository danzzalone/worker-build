name: Azazel Web2APK Build

on:
  workflow_dispatch:
    inputs:
      source_url:
        required: true
      app_name:
        required: true
        default: 'web_app'
      release_tag:
        required: true

permissions:
  contents: write

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p out_apk web_src
          curl -L -sS "${{ inputs.source_url }}" -o web_src/site.zip
          unzip -q web_src/site.zip -d web_src/app
          python3 scripts/gen_webapk.py --src web_src/app --name "${{ inputs.app_name }}" --out "$GITHUB_WORKSPACE/out_apk/${{ inputs.app_name }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: out_apk/${{ inputs.app_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
