name: Azazel Default Build (All Worker)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'flutter, native, or web'
        required: true
        default: 'flutter'
      build_mode:
        description: 'release or debug'
        required: true
        default: 'release'
      source_url:
        description: 'Direct URL to source zip'
        required: true
      app_name:
        description: 'Output APK name'
        required: true
        default: 'azazel_output'
      release_tag:
        description: 'Release tag'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Worker
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        if: inputs.build_type == 'flutter' || inputs.build_type == 'web'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare & Extract ZIP
        run: |
          mkdir -p out_apk extracted
          curl -L -sS "${{ inputs.source_url }}" -o extracted/source.zip
          unzip -q extracted/source.zip -d extracted/project

      - name: Build Flutter APK
        if: inputs.build_type == 'flutter'
        run: |
          PROJ_DIR=$(find extracted/project -maxdepth 3 -name "pubspec.yaml" | head -n 1 | xargs dirname)
          cd "$PROJ_DIR"
          flutter pub get
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            flutter build apk --release --no-tree-shake-icons
            APK=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -n 1)
          else
            flutter build apk --debug
            APK=$(find build/app/outputs/flutter-apk -name "app-debug.apk" | head -n 1)
          fi
          cp "$APK" "$GITHUB_WORKSPACE/out_apk/${{ inputs.app_name }}.apk"

      - name: Build Native Java/Kotlin APK
        if: inputs.build_type == 'native'
        run: |
          PROJ_DIR=$(find extracted/project -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1 | xargs dirname)
          cd "$PROJ_DIR"
          chmod +x ./gradlew || gradle wrapper
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
            APK=$(find . -path "*/outputs/apk/release/*.apk" | head -n 1)
          else
            ./gradlew assembleDebug --no-daemon
            APK=$(find . -path "*/outputs/apk/debug/*.apk" | head -n 1)
          fi
          cp "$APK" "$GITHUB_WORKSPACE/out_apk/${{ inputs.app_name }}.apk"

      - name: Build Web2APK via scripts/gen_webapk.py
        if: inputs.build_type == 'web'
        run: |
          python3 scripts/gen_webapk.py --src extracted/project --name "${{ inputs.app_name }}" --out "$GITHUB_WORKSPACE/out_apk/${{ inputs.app_name }}.apk"

      - name: Upload Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: out_apk/${{ inputs.app_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
