name: Azazel Flutter Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        required: true
        default: 'release'
      source_url:
        required: true
      app_name:
        required: true
        default: 'flutter_app'
      release_tag:
        required: true

permissions:
  contents: write

jobs:
  flutter-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: |
          mkdir -p out_apk src_zip
          curl -L -sS "${{ inputs.source_url }}" -o src_zip/app.zip
          unzip -q src_zip/app.zip -d src_zip/proj
          PROJ=$(find src_zip/proj -maxdepth 3 -name "pubspec.yaml" | head -n 1 | xargs dirname)
          cd "$PROJ" && flutter pub get
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            flutter build apk --release --no-tree-shake-icons
            APK=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -n 1)
          else
            flutter build apk --debug
            APK=$(find build/app/outputs/flutter-apk -name "app-debug.apk" | head -n 1)
          fi
          cp "$APK" "$GITHUB_WORKSPACE/out_apk/${{ inputs.app_name }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: out_apk/${{ inputs.app_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
